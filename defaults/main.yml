---
# Base repositories of Debian and Ubuntu. The role leaves them alone unless
# this is true, and then writes debian.sources or ubuntu.sources and empties
# /etc/apt/sources.list.
repomgmt_manage_base: false

repomgmt_debian_mirror: http://deb.debian.org/debian
repomgmt_debian_security_mirror: http://deb.debian.org/debian-security
repomgmt_debian_components:
  - main
  - non-free-firmware
repomgmt_debian_backports: false

repomgmt_ubuntu_mirror: "{{ repomgmt_ubuntu_default_mirror }}"
repomgmt_ubuntu_security_mirror: "{{ repomgmt_ubuntu_default_security_mirror }}"
repomgmt_ubuntu_components:
  - main
  - restricted
  - universe
  - multiverse
repomgmt_ubuntu_backports: true

# Extra repositories. Each one applies only to the platforms that it supports.

# Debian
repomgmt_deb_multimedia: false
# Debian and Ubuntu
repomgmt_nginx: false
repomgmt_mariadb: false
repomgmt_mariadb_version: "11.8"
# Debian, and Ubuntu with the ondrej/php PPA
repomgmt_sury: false
# EL
repomgmt_epel: false
# EL and Fedora. Remi and RPM Fusion need EPEL on EL, so they add it.
repomgmt_remi: false
repomgmt_rpmfusion: false
# openSUSE Leap
repomgmt_packman: false
