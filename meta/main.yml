---
galaxy_info:
  role_name: repomgmt
  namespace: mablanco
  author: Marco Antonio Blanco
  description: Manage the base and extra software repositories of several Linux distributions
  license: GPL-3.0-only
  min_ansible_version: "2.17"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - noble
        - resolute
    - name: EL
      versions:
        - "9"
        - "10"
    # Galaxy's schema has no recent Fedora or openSUSE versions. Tested on
    # Fedora 43 and 44 and openSUSE Leap 16.0.
    - name: Fedora
      versions:
        - all
    - name: opensuse
      versions:
        - all

  galaxy_tags:
    - packaging
    - repositories
    - apt
    - dnf

dependencies: []
