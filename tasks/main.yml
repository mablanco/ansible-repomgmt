---
- name: Repos | Check the platform
  ansible.builtin.assert:
    that: >-
      ansible_facts['distribution'] in ['Debian', 'Ubuntu', 'Fedora']
      or ansible_facts['os_family'] in ['RedHat', 'Suse']
    fail_msg: "The role does not support {{ ansible_facts['distribution'] }}."
    quiet: true

- name: Repos | Manage the repositories (Debian and Ubuntu)
  ansible.builtin.include_tasks: apt.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Repos | Manage the repositories (EL)
  ansible.builtin.include_tasks: el.yml
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution'] != 'Fedora'

- name: Repos | Manage the repositories (Fedora)
  ansible.builtin.include_tasks: fedora.yml
  when: ansible_facts['distribution'] == 'Fedora'

- name: Repos | Manage the repositories (openSUSE)
  ansible.builtin.include_tasks: suse.yml
  when: ansible_facts['os_family'] == 'Suse'
